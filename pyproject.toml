[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dice"
version = "0.1.0"
description = "CLI-утилита для бросания костей со статистикой"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
dice = "dice:cli"

[tool.setuptools]
py-modules = ["dice"]